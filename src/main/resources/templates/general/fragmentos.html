<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <!-- HEAD -->
    <head th:fragment="head">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>TransLogi</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}"/>

    </head>


    <!-- SIDEBAR -->
    <aside th:fragment="sidebar" class="sidebar">

        <div class="logo">
            <h3>
                <i class="bi bi-truck"></i>
                TransLogi
            </h3>
            <p>[[#{aplicacion.subtitulo}]]</p>
        </div>

        <nav class="sidebar-menu">

            <!-- Menú general accesible para administradores y supervisores -->
            <div sec:authorize="hasAnyRole('Administrador','Supervisor')">

                <a th:href="@{/}">
                    <i class="bi bi-speedometer2"></i> [[#{menu.dashboard}]]
                </a>
                
                <a th:href="@{/viaje/listado}">
                    <i class="bi bi-truck"></i> [[#{menu.viajes}]]
                </a>

                <a th:href="@{/conductor/listado}">
                    <i class="bi bi-person-badge"></i> [[#{menu.conductores}]]
                </a>

                <a th:href="@{/empresa/listado}">
                    <i class="bi bi-buildings"></i> [[#{menu.empresas}]]
                </a>

                <a th:href="@{/ubicacion/listado}">
                    <i class="bi bi-geo-alt"></i> [[#{ubicacion.titulo}]]
                </a>

                <a th:href="@{/reportes/listado}">
                    <i class="bi bi-file-earmark-bar-graph"></i> [[#{reporte.titulo}]]
                </a>

            </div>

            <!-- [[#{menu.usuarios}]]: solo Administrador -->
            <div sec:authorize="hasRole('Administrador')">
                <a th:href="@{/usuario/listado}">
                    <i class="bi bi-people"></i> [[#{menu.usuarios}]]
                </a>
            </div>

            <!-- Menú exclusivo para [[#{menu.conductores}]] -->
            <div sec:authorize="hasRole('Conductor')">
                <a th:href="@{/conductor/mis-viajes}">
                    <i class="bi bi-journal-text"></i> [[#{menu.misViajes}]]
                </a>
            </div>

        </nav>

        <div class="sidebar-footer">

            <div class="language-switcher mb-3">
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle w-100"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <i class="bi bi-translate me-1"></i>
                        [[#{plantilla.idioma}]]
                    </button>

                    <ul class="dropdown-menu dropdown-menu-dark w-100">
                        <li>
                            <a class="dropdown-item"
                               href="?lang=es">
                                Español
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item"
                               href="?lang=en">
                                English
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <hr class="text-secondary">

            <!-- Sección cuando NO está autenticado ([[#{login.iniciar}]]) -->
            <div sec:authorize="!isAuthenticated()" class="px-3 mb-2">
                <a th:href="@{/login}" class="btn btn-primary btn-sm w-100">
                    <i class="bi bi-box-arrow-in-right"></i> [[#{login.iniciar}]]
                </a>
            </div>

            <!-- Sección cuando SÍ está autenticado ([[#{campo.usuario}]] + [[#{menu.cerrarSesion}]]) -->
            <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                <li class="nav-item my-auto px-2">
                    <a class="nav-link text-white d-flex align-items-center p-0 mb-2">
                        <img th:src="@{${session.imagenUsuario}}"
                             alt="Avatar" height="35" width="35" class="rounded-circle me-2 object-fit-cover"/>
                        <span sec:authentication="name" class="fw-semibold text-truncate"></span>
                    </a>
                </li>

                <li class="nav-item my-auto">
                    <form method="POST" th:action="@{/logout}" class="px-2 mb-2">
                        <button type="submit" class="btn btn-danger btn-sm w-100">
                            <i class="bi bi-box-arrow-left"></i> [[#{menu.cerrarSesion}]]
                        </button>
                    </form>
                </li>
            </ul>

            <hr class="text-secondary">

            <small class="text-white-50 d-block text-center pb-2">
                Grupo 3 - TransLogi
            </small>

        </div>

    </aside>


    <!-- FOOTER -->
    <footer th:fragment="scripts">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/viaje.js}"></script>
        <script th:src="@{/js/conductor.js}"></script>
        <script th:src="@{/js/empresa.js}"></script>
        <script th:src="@{/js/ubicacion.js}"></script>
        <script th:src="@{/js/usuario.js}"></script>
    </footer>

</html>
