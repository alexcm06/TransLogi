<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <!-- TÃTULO -->
    <section th:fragment="titulo">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold mb-1">
                    <i class="bi bi-buildings-fill text-primary"></i>
                    [[#{menu.empresas}]]
                </h2>

                <p class="page-subtitle">
                    [[#{empresa.subtitulo}]]
                </p>

            </div>

            <button class="btn btn-primary"
                    sec:authorize="hasAnyRole('Administrador','Supervisor')"
                    data-bs-toggle="modal"
                    data-bs-target="#modalAgregarEmpresa">

                <i class="bi bi-plus-circle"></i>
                [[#{empresa.nueva}]]

            </button>

        </div>

    </section>
    <!-- TABLA -->
    <section th:fragment="tablaEmpresas">

        <div class="card border-0 shadow-sm rounded-4">

            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                    [[#{empresa.lista}]]
                </h5>

                <span class="badge bg-primary fs-6"
                      th:text="${totalEmpresas}">
                    0
                </span>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th>[[#{campo.empresa}]]</th>
                            <th>[[#{campo.telefono}]]</th>
                            <th>[[#{campo.correo}]]</th>
                            <th>[[#{campo.estado}]]</th>
                            <th class="text-center">[[#{accion.acciones}]]</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="empresa : ${empresas}">

                            <td th:text="${empresa.nombre}"></td>

                            <td th:text="${empresa.telefono}"></td>

                            <td th:text="${empresa.correoContacto}"></td>

                            <td>

                                <span class="badge"
                                      th:classappend="${empresa.activo} ? ' bg-success' : ' bg-danger'"
                                      th:text="${empresa.activo} ? #{campo.activo} : #{campo.inactivo}">
                                </span>

                            </td>

                            <td class="text-center">

                                <a class="btn btn-warning btn-sm"
                                   sec:authorize="hasAnyRole('Administrador','Supervisor')"
                                   th:href="@{/empresa/modificar/{id}(id=${empresa.idEmpresa})}">

                                    <i class="bi bi-pencil-square"></i>

                                </a>

                                <button class="btn btn-danger btn-sm"
                                        sec:authorize="hasRole('Administrador')"
                                        data-bs-toggle="modal"
                                        data-bs-target="#modalEliminarEmpresa"
                                        th:data-id="${empresa.idEmpresa}"
                                        th:data-nombre="${empresa.nombre}">

                                    <i class="bi bi-trash"></i>

                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>
    <!-- MODAL AGREGAR EMPRESA -->
    <div class="modal fade"
         id="modalAgregarEmpresa"
         tabindex="-1"
         aria-hidden="true"
         sec:authorize="hasAnyRole('Administrador','Supervisor')"
         th:fragment="modalAgregar">

        <div class="modal-dialog">

            <div class="modal-content">

                <form th:action="@{/empresa/guardar}"
                      method="post"
                      th:object="${empresa}">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            <i class="bi bi-building-add me-2"></i>
                            [[#{empresa.nueva}]]
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <input type="hidden"
                               th:field="*{idEmpresa}">

                        <div class="mb-3">

                            <label class="form-label">
                                [[#{campo.nombre}]]
                            </label>

                            <input class="form-control"
                                   th:field="*{nombre}"
                                   required
                                   maxlength="150">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                [[#{campo.telefono}]]
                            </label>

                            <input class="form-control"
                                   type="tel"
                                   th:field="*{telefono}"
                                   pattern="[0-9]{4}-?[0-9]{4}"
                                   maxlength="9"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                [[#{campo.correo}]] de contacto
                            </label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{correoContacto}"
                                   required>

                        </div>

                        <div class="form-check form-switch">

                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{activo}">

                            <label class="form-check-label">
                                [[#{campo.empresaActiva}]]
                            </label>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            [[#{accion.cancelar}]]
                        </button>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-check-circle-fill me-1"></i>
                            [[#{accion.guardar}]]

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
    <div th:fragment="modalEliminar"
         class="modal fade"
         sec:authorize="hasRole('Administrador')"
         id="modalEliminarEmpresa"
         tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header bg-danger text-white">

                    <h5 class="modal-title">

                        <i class="bi bi-exclamation-triangle-fill"></i>

                        [[#{accion.confirmarEliminacion}]]

                    </h5>

                    <button class="btn-close btn-close-white"
                            data-bs-dismiss="modal"></button>

                </div>

                <form th:action="@{/empresa/eliminar}"
                      method="post">

                    <div class="modal-body">

                        <input type="hidden"
                               id="idEmpresaEliminar"
                               name="idEmpresa">

                        <p class="mb-0">

                            [[#{empresa.confirmarEliminar}]]

                            <strong id="nombreEmpresa"></strong>?

                        </p>

                        <small class="text-danger">

                            [[#{accion.noDeshacer}]]

                        </small>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            [[#{accion.cancelar}]]

                        </button>

                        <button
                            class="btn btn-danger"
                            type="submit">

                            <i class="bi bi-trash"></i>

                            [[#{accion.eliminar}]]

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</body>
</html>
