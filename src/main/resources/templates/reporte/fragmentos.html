<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <!-- ===================== TITULO ===================== -->

    <section th:fragment="titulo">

        <div class="container-fluid mb-4">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h2 class="fw-bold">
                        Reportes de Viajes
                    </h2>

                    <p class="text-muted mb-0">
                        Consulte y exporte reportes personalizados.
                    </p>

                </div>

            </div>

        </div>

    </section>

    <!-- ===================== FILTROS ===================== -->

    <section th:fragment="filtros">

        <div class="container-fluid">

            <div class="card shadow-sm border-0 rounded-4 mb-4">

                <div class="card-header bg-white">

                    <h5 class="mb-0 fw-semibold">
                        Filtros
                    </h5>

                </div>

                <div class="card-body">

                    <form th:action="@{/reportes/listado}"
                          method="get">

                        <div class="row g-3">

                            <div class="col-md-3">

                                <label class="form-label">
                                    Fecha inicio
                                </label>

                                <input type="date"
                                       class="form-control"
                                       name="fechaInicio"
                                       th:value="${fechaInicio}">

                            </div>

                            <div class="col-md-3">

                                <label class="form-label">
                                    Fecha fin
                                </label>

                                <input type="date"
                                       class="form-control"
                                       name="fechaFin"
                                       th:value="${fechaFin}">

                            </div>

                            <div class="col-md-3">

                                <label class="form-label">
                                    Empresa
                                </label>

                                <select class="form-select"
                                        name="empresa">

                                    <option value="">
                                        Todas
                                    </option>

                                    <option th:each="e : ${empresas}"
                                            th:value="${e.idEmpresa}"
                                            th:text="${e.nombre}"
                                            th:selected="${empresa == e.idEmpresa}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label">
                                    Conductor
                                </label>

                                <select class="form-select"
                                        name="conductor">

                                    <option value="">
                                        Todos
                                    </option>

                                    <option th:each="c : ${conductores}"
                                            th:value="${c.idConductor}"
                                            th:text="${c.nombre}"
                                            th:selected="${conductor == c.idConductor}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label">
                                    Estado
                                </label>

                                <select class="form-select"
                                        name="estado">

                                    <option value="">
                                        Todos
                                    </option>

                                    <option th:each="e : ${estados}"
                                            th:value="${e.idEstadoViaje}"
                                            th:text="${e.nombreEstado}"
                                            th:selected="${estado == e.idEstadoViaje}">
                                    </option>

                                </select>

                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-end gap-2">

                            <button class="btn btn-primary">

                                <i class="bi bi-search"></i>
                                Buscar

                            </button>
                            
                            <a th:href="@{/reportes/listado}"
                               class="btn btn-outline-secondary">
                                Limpiar
                            </a>

                            <a class="btn btn-success"
                               th:href="@{/reportes/excel(
                               fechaInicio=${fechaInicio},
                               fechaFin=${fechaFin},
                               empresa=${empresa},
                               conductor=${conductor},
                               estado=${estado})}">

                                <i class="bi bi-file-earmark-excel"></i>
                                Exportar Excel

                            </a>

                            <a class="btn btn-danger"
                               href="#">

                                <i class="bi bi-file-earmark-pdf"></i>
                                PDF

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </section>

    <!-- ===================== TABLA ===================== -->

    <section th:fragment="tablaReportes">

        <div class="container-fluid">

            <div class="card shadow-sm border-0 rounded-4">

                <div class="card-header bg-white d-flex justify-content-between align-items-center">

                    <h5 class="mb-0 fw-semibold">

                        Resultados

                    </h5>

                    <span class="badge bg-primary"
                          th:text="${#lists.size(viajes)}">

                    </span>

                </div>

                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table class="table table-hover mb-0 align-middle">

                            <thead class="table-light">

                                <tr>
                                    <th>Fecha</th>
                                    <th>Hora</th>
                                    <th>Empresa</th>
                                    <th>Conductor</th>
                                    <th>Origen</th>
                                    <th>Destino</th>
                                    <th>Estado</th>

                                </tr>

                            </thead>

                            <tbody>

                                <tr th:each="v : ${viajes}">

                                    <td th:text="${v.fechaProgramada}"></td>

                                    <td th:text="${v.horaProgramada}"></td>

                                    <td th:text="${v.empresa.nombre}"></td>

                                    <td th:text="${v.conductor.nombre}"></td>

                                    <td th:text="${v.origen.nombre}"></td>

                                    <td th:text="${v.destino.nombre}"></td>

                                    <td>

                                        <span class="badge"

                                              th:classappend="
                                              ${v.estadoViaje.nombreEstado == 'Programado'} ? ' bg-primary' :
                                              (${v.estadoViaje.nombreEstado == 'En Proceso'} ? ' bg-warning text-dark' :
                                              (${v.estadoViaje.nombreEstado == 'Finalizado'} ? ' bg-success' :
                                              (${v.estadoViaje.nombreEstado == 'Cancelado'} ? ' bg-danger' :
                                              ' bg-secondary')))"

                                              th:text="${v.estadoViaje.nombreEstado}">

                                        </span>

                                    </td>

                                </tr>

                                <tr th:if="${#lists.isEmpty(viajes)}">

                                    <td colspan="8"
                                        class="text-center py-5 text-muted">

                                        No existen resultados.

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </section>

</html>
