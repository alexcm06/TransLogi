<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <aside th:replace="~{general/fragmentos :: sidebar}"></aside>

        <main class="main-content">

            <div class="container-fluid">

                <!-- TÍTULO DE LA VISTA -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">
                            <i class="bi bi-truck text-primary"></i>
                            Mis Viajes Asignados
                        </h2>
                        <p class="page-subtitle">
                            Consulta el listado de tus viajes programados y en curso.
                        </p>
                    </div>
                </div>

                <!-- ALERTA EN CASO DE ERROR -->
                <div th:if="${error}" class="alert alert-danger shadow-sm border-0 mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                </div>

                <!-- TABLA DE VIAJES -->
                <div class="card shadow-sm border-0 rounded-4">

                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-semibold">Viajes del Conductor: <span class="text-primary" th:text="${conductor != null ? conductor.nombre : ''}"></span></h5>
                        <span class="badge bg-primary fs-6" th:text="${totalViajes}">0</span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th># ID</th>
                                    <th>Fecha Programada</th>
                                    <th>Empresa</th>
                                    <th>Estado del Viaje</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${viajes}">
                                    <td class="fw-bold" th:text="${v.idViaje}"></td>
                                    <td th:text="${v.fechaProgramada}"></td>
                                    <td th:text="${v.empresa != null ? v.empresa.nombreEmpresa : 'Sin Empresa'}"></td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${v.estadoViaje != null && v.estadoViaje.nombreEstado == 'Programado'} ? ' bg-warning text-dark' : 
                                                              (${v.estadoViaje != null && v.estadoViaje.nombreEstado == 'En Proceso'} ? ' bg-info text-dark' : ' bg-success')"
                                              th:text="${v.estadoViaje != null ? v.estadoViaje.nombreEstado : 'Desconocido'}">
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <!-- Enlace futuro para ver el detalle de la ruta o mapa -->
                                        <a th:href="@{/conductor/viaje/detalle/{id}(id=${v.idViaje})}" 
                                           class="btn btn-outline-primary btn-sm"
                                           title="Ver detalles del viaje">
                                            <i class="bi bi-eye"></i> Detalle
                                        </a>
                                    </td>
                                </tr>
                                <!-- Mensaje por si la lista viene vacía -->
                                <tr th:if="${#lists.isEmpty(viajes)}">
                                    <td colspan="5" class="text-center py-4 text-muted">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        No tienes viajes asignados en este momento.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: scripts}"></footer>

    </body>
</html>
