<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <aside th:replace="~{general/fragmentos :: sidebar}"></aside>

        <main class="main-content">

            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h2 class="page-title">Modificar Conductor</h2>
                        <p class="page-subtitle">
                            Actualice la información del conductor.
                        </p>
                    </div>

                    <a th:href="@{/conductor/listado}"
                       class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i>
                        Volver
                    </a>

                </div>

                <div class="card shadow-sm">

                    <div class="card-body">

                        <form th:action="@{/conductor/guardar}"
                              method="post"
                              enctype="multipart/form-data"
                              th:object="${conductor}">

                            <input type="hidden" th:field="*{idConductor}"/>

                            <input type="hidden" th:field="*{fotoLicenciaFrente}"/>
                            <input type="hidden" th:field="*{fotoLicenciaReverso}"/>

                            <!-- LICENCIA ACTUAL -->
                            <div class="row mb-4">

                                <div class="col-md-6 text-center">

                                    <label class="form-label fw-bold">
                                        Licencia (Frente)
                                    </label>

                                    <div>

                                        <img th:if="${conductor.fotoLicenciaFrente != null}"
                                             th:src="${conductor.fotoLicenciaFrente}"
                                             class="img-thumbnail"
                                             style="max-width:350px;">

                                        <p th:unless="${conductor.fotoLicenciaFrente != null}"
                                           class="text-muted">

                                            No hay imagen del frente.

                                        </p>

                                    </div>

                                </div>

                                <div class="col-md-6 text-center">

                                    <label class="form-label fw-bold">
                                        Licencia (Reverso)
                                    </label>

                                    <div>

                                        <img th:if="${conductor.fotoLicenciaReverso != null}"
                                             th:src="${conductor.fotoLicenciaReverso}"
                                             class="img-thumbnail"
                                             style="max-width:350px;">

                                        <p th:unless="${conductor.fotoLicenciaReverso != null}"
                                           class="text-muted">

                                            No hay imagen del reverso.

                                        </p>

                                    </div>

                                </div>

                            </div>

                            <!-- NUEVAS IMÁGENES -->
                            <div class="row mb-4">

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Reemplazar licencia (Frente)
                                    </label>

                                    <input type="file"
                                           class="form-control"
                                           name="fotoFrontal"
                                           accept=".jpg,.jpeg,.png">

                                    <small class="text-muted">
                                        Si no selecciona una imagen se conservará la actual.
                                    </small>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Reemplazar licencia (Reverso)
                                    </label>

                                    <input type="file"
                                           class="form-control"
                                           name="fotoReverso"
                                           accept=".jpg,.jpeg,.png">

                                    <small class="text-muted">
                                        Si no selecciona una imagen se conservará la actual.
                                    </small>

                                </div>

                            </div>

                            <!-- DATOS -->
                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Nombre
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Teléfono
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{telefono}"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Número de Licencia
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{numeroLicencia}"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Vencimiento Licencia
                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           th:field="*{fechaVencimientoLicencia}"
                                           required>

                                </div>

                                <div class="col-md-6 mb-4">

                                    <label class="form-label">
                                        Estado
                                    </label>

                                    <select class="form-select"
                                            th:field="*{activo}">

                                        <option th:value="true">
                                            Activo
                                        </option>

                                        <option th:value="false">
                                            Inactivo
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="text-end">

                                <a th:href="@{/conductor/listado}"
                                   class="btn btn-secondary">

                                    Cancelar

                                </a>

                                <button type="submit"
                                        class="btn btn-primary">

                                    <i class="bi bi-check-lg"></i>
                                    Guardar cambios

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
        <div th:replace="~{general/fragmentos :: scripts}"></div>

    </body>

</html>
