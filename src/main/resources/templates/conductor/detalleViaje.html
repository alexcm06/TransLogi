<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <aside th:replace="~{general/fragmentos :: sidebar}"></aside>

        <main class="main-content">

            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">
                            <i class="bi bi-truck text-primary"></i>
                            Detalle del Viaje #<span th:text="${viaje.idViaje}"></span>
                        </h2>
                        <p class="text-muted mb-0">
                            Información del viaje asignado
                        </p>
                    </div>

                    <a th:href="@{/conductor/mis-viajes}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i>
                        Volver
                    </a>
                </div>

                <div th:if="${todoOk}" class="alert alert-success shadow-sm border-0 mb-4">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${todoOk}"></span>
                </div>

                <div th:if="${error}" class="alert alert-danger shadow-sm border-0 mb-4">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                </div>

                <div class="card shadow-sm border-0 rounded-4">

                    <div class="card-body">

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="text-muted small">Fecha Programada</label>
                                <p class="fw-semibold" th:text="${viaje.fechaProgramada}"></p>
                            </div>
                            <div class="col-md-4">
                                <label class="text-muted small">Hora Programada</label>
                                <p class="fw-semibold" th:text="${viaje.horaProgramada}"></p>
                            </div>
                            <div class="col-md-4">
                                <label class="text-muted small">Empresa</label>
                                <p class="fw-semibold" th:text="${viaje.empresa.nombre}"></p>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="text-muted small">Origen</label>
                                <p class="fw-semibold">
                                    <i class="bi bi-geo-alt text-success"></i>
                                    <span th:text="${viaje.origen.nombre}"></span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <label class="text-muted small">Destino</label>
                                <p class="fw-semibold">
                                    <i class="bi bi-geo-alt-fill text-danger"></i>
                                    <span th:text="${viaje.destino.nombre}"></span>
                                </p>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label class="text-muted small">Estado Actual</label>
                                <p>
                                    <span class="badge fs-6"
                                          th:classappend="
                                          ${viaje.estadoViaje.nombreEstado == 'Programado'} ? ' bg-primary' :
                                          (${viaje.estadoViaje.nombreEstado == 'En proceso'} ? ' bg-warning text-dark' :
                                          (${viaje.estadoViaje.nombreEstado == 'Finalizado'} ? ' bg-success' :
                                          (${viaje.estadoViaje.nombreEstado == 'Cancelado'} ? ' bg-danger' :
                                          ' bg-secondary')))"
                                          th:text="${viaje.estadoViaje.nombreEstado}">
                                    </span>
                                </p>
                            </div>
                        </div>

                        <hr>

                        <!-- FORMULARIO PARA CAMBIAR EL ESTADO -->
                        <form th:action="@{/conductor/viaje/cambiar-estado}" method="post" class="row g-3 align-items-end">

                            <input type="hidden" name="idViaje" th:value="${viaje.idViaje}">

                            <div class="col-md-6">
                                <label class="form-label">Actualizar estado del viaje</label>
                                <select class="form-select" name="idEstado" required>
                                    <option th:each="e : ${estados}"
                                            th:value="${e.idEstadoViaje}"
                                            th:text="${e.nombreEstado}"
                                            th:selected="${e.idEstadoViaje == viaje.estadoViaje.idEstadoViaje}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i>
                                    Actualizar Estado
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: scripts}"></footer>

    </body>

</html>
