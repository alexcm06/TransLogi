<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <aside th:replace="~{general/fragmentos :: sidebar}"></aside>

        <main class="main-content">

            <section th:replace="~{usuario/fragmentos :: titulo}"></section>

            <div th:if="${todoOk}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${todoOk}"></span>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

            <section th:replace="~{usuario/fragmentos :: tablaUsuarios}"></section>

        </main>

        <div th:replace="~{usuario/fragmentos :: modalAgregarUsuario}"></div>

        <div th:replace="~{usuario/fragmentos :: modalEliminarUsuario}"></div>

        <footer th:replace="~{general/fragmentos :: scripts}"></footer>

    </body>

</html>
