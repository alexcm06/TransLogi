spring.application.name=TransLogi
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.security=DEBUG
logging.level.com.TransLogi.security=TRACE

#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=techshop-b0f15.firebasestorage.app
firebase.storage.path=translogi
firebase.json.path=/etc/secrets
firebase.json.file=firebase-service-account.json

spring.messages.encoding=UTF-8
